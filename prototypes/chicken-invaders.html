<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PROTO: Chicken Invaders / Cluck Horizon — mechanics proof (INTERNAL)</title>
<style>
  html,body{margin:0;height:100%;background:#050510;display:flex;align-items:center;justify-content:center;font-family:monospace}
  canvas{max-width:100vw;max-height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
"use strict";
/* maga-proto: Chicken Invaders (replica) + Cluck Horizon (original) — core-loop mechanics proof.
 * Specs: 01-design-docs/02-concept-specs/04-chicken-invaders.md + 06-chicken-invaders-original.md
 * Loop: chapter -> waves of formation chickens (dodge eggs) -> boss -> chapter clear -> unlock.
 *       Gifts/crates cycle weapons; drumsticks/rations feed missile stock; lives + respawn.
 * One skeleton, two content packs (spec 06 §FORGE: "shared shmup skeleton + content packs").
 * All combat constants are DECLARED GUESSES (dossier: every numeric = TBD from ARCADE playtest).
 */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ---------------- content packs (shared skeleton, swapped content) ----------------
const PACKS = {
  replica: {
    id: 'replica', title: 'CHICKEN INVADERS', sub: 'The Next Wave — formula replica slice',
    weapons: ['PEA SHOOTER', 'TWIN BOLT', 'TRI-SPREAD'],
    gift: 'GIFT', food: 'DRUMSTICK', enemy: 'CHICKEN', boss: 'BIG HEN',
    ship: '#4dabf7', foe: '#ffd43b', foe2: '#ff8787', egg: '#fff3bf',
    bg0: '#0b0018', bg1: '#1a0b2e', accent: '#ff6b6b',
    shipHi: '#a5d8ff', bullet: '#8ce99a', belly: '#ffec99', beak: '#fd7e14', comb: '#e03131',
    neb1: '#5f3dc4', neb2: '#c2255c', planet: '#2f2b5c', ring: '#9775fa', giftCol: '#e599f7',
    jokes: null
  },
  cluck: {
    id: 'cluck', title: 'CLUCK HORIZON', sub: 'courier vs the flock — original IP slice',
    weapons: ['SOUP LASER', 'SPATULA SPREAD', 'WHISK BARRAGE'],
    gift: 'CRATE', food: 'RATIONS', enemy: 'FLOCKBIRD', boss: 'MOTHER GOOSE',
    ship: '#20c997', foe: '#ffa94d', foe2: '#ffe066', egg: '#ffe8cc',
    bg0: '#001a1a', bg1: '#00332b', accent: '#20c997',
    shipHi: '#96f2d7', bullet: '#ffe066', belly: '#ffe8cc', beak: '#e8590c', comb: '#ffd43b',
    neb1: '#0b7285', neb2: '#087f5b', planet: '#3b4a48', ring: '#63e6be', giftCol: '#3fd9b2',
    jokes: ['Courier log: the flock took my route. Rude.',
            'Courier log: eggs again. Sending them the invoice.']
  }
};

// ---------------- tunables (ALL TBD from ARCADE playtest — declared, not measured) ----------------
const DT = 1/120;
const SHIP_ACC = 2600, SHIP_DAMP = 7.5, SHIP_MAXV = 400;   // inertia / float feel
const SHIP_R = 13, SHIP_Y0 = H - 60;
const FIRE_EVERY = 0.17, BULLET_V = -560, BULLET_DMG = 1;
const EGG_V = 150, EGG_R = 6;
const MISSILE_V = -330, MISSILE_DMG = 12, MISSILE_START = 2, MISSILE_CAP = 6;
const PICKUP_V = 95, GIFT_CHANCE = 0.12;
const LIVES_START = 3, RESPAWN_S = 1.2, INVULN_S = 2.0;    // spec #6: back in fight <=2s
const CHAPTER_CLEAR_S = 2.6;

// chapter -> wave list; boss appended after last wave. rows/cols = formation grid.
const CHAPTERS = [
  [ {pattern:'straight', rows:2, cols:6, hp:2, eggEvery:3.0},
    {pattern:'swoop',    rows:2, cols:6, hp:2, eggEvery:2.4} ],
  [ {pattern:'dive',     rows:2, cols:7, hp:3, eggEvery:2.1},
    {pattern:'swoop',    rows:3, cols:6, hp:3, eggEvery:1.8} ],
];
const BOSS_HP = [60, 100];

// ---------------- state ----------------
const keys = {};
let pack = PACKS.replica;
let mode, ship, bullets, missiles, eggs, pickups, chickens, boss, parts;
let chapter, waveIdx, score, lives, missileN, weaponLv, killsInChapter;
let waveT, eggT, diveT, clearT, deadT, jokeT, paused, fireHeld, fireT, lastDeath;
let drag = null, touchMode = false;   // layout B: one-thumb relative drag + auto-fire (spec 04 §Controls B)
let stick = null;                     // layout A: left-half virtual stick {id,ox,oy,x,y} (spec 04 §Controls A)
const firePtrs = new Set();           // layout A: right-half held pointers = fire
let layout = localStorage.getItem('ci_proto_layout') || 'A';  // spec 04 §Mobile: A twin-thumb recommended, B one-thumb
const MISSILE_BTN_B = {x: W-92, y: H-92, w: 64, h: 64};       // B: edge button bottom-right
const MISSILE_BTN_A = {x: W-92, y: H-172, w: 64, h: 64};      // A: above fire button
const FIRE_BTN_A = {x: W-92, y: H-92, w: 64, h: 64};          // A: hold-fire (whole right half fires)
const missileBtn = () => layout === 'A' ? MISSILE_BTN_A : MISSILE_BTN_B;
let unlocked = +(localStorage.getItem('ci_proto_unlock_' + pack.id) || 1);

const stars = [];
for (let i = 0; i < 140; i++) { // 3 brightness tiers x 2 parallax speed layers (twinkle is draw-side via .tw)
  const r = Math.random(), tier = r < .55 ? 0 : r < .88 ? 1 : 2, layer = i % 2;
  stars.push({x: Math.random()*W, y: Math.random()*H, s: 1 + tier, tier, layer,
    v: layer ? 36 + Math.random()*26 : 10 + Math.random()*18,
    tw: 1.2 + Math.random()*3.2, a: [.45, .7, 1][tier], o: [3, 4.5, 7.5][tier]});
}

function startGame(ch) {
  chapter = ch; waveIdx = 0; score = 0; lives = LIVES_START;
  missileN = MISSILE_START; weaponLv = 0; killsInChapter = 0;
  ship = {x: W/2, y: SHIP_Y0, vx: 0, vy: 0, alive: true, invuln: 0};
  bullets = []; missiles = []; eggs = []; pickups = []; parts = [];
  boss = null; fireT = 0; deadT = 0; jokeT = 2.2;
  mode = 'play'; paused = false;
  spawnWave();
}
function spawnWave() {
  const w = CHAPTERS[chapter-1][waveIdx];
  chickens = []; waveT = 0; eggT = 1.2; diveT = 1.5;
  const cw = 64, ch2 = 44, ox = (W - w.cols*cw)/2 + cw/2, oy = 70;
  for (let r = 0; r < w.rows; r++) for (let c = 0; c < w.cols; c++)
    chickens.push({bx: ox + c*cw, by: oy + r*ch2, x: ox + c*cw, y: -60 - r*30,
                   hp: w.hp, t: Math.random()*6, dive: 0, dvx: 0, dvy: 0, enter: 1});
}
function spawnBoss() {
  const hp = BOSS_HP[chapter-1];
  boss = {x: W/2, y: -80, hp, max: hp, t: 0, volley: 2.0, radial: 5.0, warn: 0};
  chickens = [];
}
function burst(x, y, n, col) {
  const sh = col === pack.ship ? 'debris' : 'feather'; // draw-side shape tag only
  for (let i = 0; i < n; i++) parts.push({x, y, vx:(Math.random()-.5)*420, vy:(Math.random()-.5)*420-80,
    s: 2+Math.random()*5, life:.4+Math.random()*.5, col, sh, spin:(Math.random()-.5)*4});
}
function dropPickup(x, y) {
  killsInChapter++;
  let kind = null;
  if (killsInChapter === 1) kind = 'gift';        // deterministic: 1st kill = weapon cycle
  else if (killsInChapter === 2) kind = 'food';   // deterministic: 2nd kill = missile refill
  else if (Math.random() < GIFT_CHANCE) kind = Math.random() < .6 ? 'gift' : 'food';
  if (kind) pickups.push({x, y, vy: PICKUP_V, kind});
}
function fireMissile() {
  if (mode !== 'play' || !ship.alive || missileN <= 0) return;
  missileN--;
  missiles.push({x: ship.x, y: ship.y - 18, vy: MISSILE_V});
}
function fireGuns() {
  const y = ship.y - 16, v = BULLET_V;
  if (weaponLv === 0) bullets.push({x: ship.x, y, vx: 0, vy: v});
  else if (weaponLv === 1) { bullets.push({x: ship.x-9, y, vx: 0, vy: v}, {x: ship.x+9, y, vx: 0, vy: v}); }
  else { bullets.push({x: ship.x, y, vx: 0, vy: v}, {x: ship.x-8, y, vx: -70, vy: v*.96}, {x: ship.x+8, y, vx: 70, vy: v*.96}); }
}
function hitShip(cause) {
  if (!ship.alive || ship.invuln > 0) return;
  ship.alive = false; deadT = 0; lives--;
  lastDeath = {cause, x: ship.x|0, y: ship.y|0, t: +waveT.toFixed(1)};
  burst(ship.x, ship.y, 30, pack.ship);
}
function killChicken(c) {
  burst(c.x, c.y, 16, pack.foe);
  score += 100;
  dropPickup(c.x, c.y);
}

// ---------------- input ----------------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.repeat) return;
  if (mode === 'title') {
    if (e.code === 'KeyT') setPack(pack.id === 'replica' ? 'cluck' : 'replica');
    if (e.code === 'KeyL') setLayout(layout === 'A' ? 'B' : 'A');
    if (e.code === 'Digit1') titleSel = 1;
    if (e.code === 'Digit2' && unlocked >= 2) titleSel = 2;
    if (e.code === 'Enter' || e.code === 'Space') startGame(titleSel);
  } else if (mode === 'play') {
    if (['Space','KeyZ'].includes(e.code)) { fireHeld = true; e.preventDefault(); }
    if (['KeyX','ShiftLeft','ShiftRight'].includes(e.code)) fireMissile();
    if (['Escape','KeyP'].includes(e.code)) paused = !paused;
  } else if (['gameover','win'].includes(mode)) {
    if (e.code === 'KeyR' || e.code === 'Enter') mode = 'title';
  }
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (['Space','KeyZ'].includes(e.code)) fireHeld = false;
});
cv.addEventListener('pointerdown', e => {
  const p = cvPos(e);
  if (e.pointerType === 'touch') touchMode = true;
  if (mode === 'title') { titleClick(p.x, p.y); return; }
  if (mode === 'play') {
    if (e.button === 2) { fireMissile(); return; }
    const b = missileBtn();
    if (p.x >= b.x && p.x <= b.x+b.w && p.y >= b.y && p.y <= b.y+b.h) { fireMissile(); return; }
    if (e.pointerType === 'touch' && layout === 'A') {
      // twin-thumb: left half = virtual stick, right half = hold-fire
      if (p.x < W/2) { if (!stick) stick = {id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y}; }
      else { firePtrs.add(e.pointerId); fireHeld = true; }
      return;
    }
    fireHeld = true;
    drag = {id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y, sx: ship.x, sy: ship.y};
  }
  else if (['gameover','win'].includes(mode)) mode = 'title';
});
cv.addEventListener('pointermove', e => {
  const p = cvPos(e);
  if (stick && e.pointerId === stick.id) { stick.x = p.x; stick.y = p.y; }
  if (drag && e.pointerId === drag.id) { drag.x = p.x; drag.y = p.y; }
});
addEventListener('pointerup', e => {
  firePtrs.delete(e.pointerId);
  if (stick && e.pointerId === stick.id) stick = null;
  if (drag && e.pointerId === drag.id) drag = null;
  if (!firePtrs.size) fireHeld = false;
});
addEventListener('pointercancel', e => {
  firePtrs.delete(e.pointerId);
  if (stick && e.pointerId === stick.id) stick = null;
  if (drag && e.pointerId === drag.id) drag = null;
  if (!firePtrs.size) fireHeld = false;
});
cv.addEventListener('contextmenu', e => e.preventDefault());
function cvPos(e) {
  const r = cv.getBoundingClientRect();
  return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height};
}
let titleSel = 1;
function setPack(id) {
  pack = PACKS[id];
  unlocked = +(localStorage.getItem('ci_proto_unlock_' + pack.id) || 1);
  if (titleSel > unlocked) titleSel = 1;
}
function setLayout(l) {
  layout = l;
  localStorage.setItem('ci_proto_layout', l);
  stick = null; drag = null; firePtrs.clear(); fireHeld = false;
}
// title hit regions (canvas-space rects)
const BTN = {start:{x:W/2-110,y:330,w:220,h:44}, pack:{x:W/2-160,y:392,w:320,h:34},
             ch1:{x:W/2-120,y:284,w:110,h:32}, ch2:{x:W/2+10,y:284,w:110,h:32},
             layout:{x:W/2-160,y:434,w:320,h:30}};
const inR = (p,r) => p.x>r.x && p.x<r.x+r.w && p.y>r.y && p.y<r.y+r.h;
function titleClick(x, y) {
  const p = {x, y};
  if (inR(p, BTN.pack)) return setPack(pack.id === 'replica' ? 'cluck' : 'replica');
  if (inR(p, BTN.layout)) return setLayout(layout === 'A' ? 'B' : 'A');
  if (inR(p, BTN.ch1)) return void (titleSel = 1);
  if (inR(p, BTN.ch2) && unlocked >= 2) return void (titleSel = 2);
  if (inR(p, BTN.start)) startGame(titleSel);
}

// ---------------- simulation ----------------
function step(dt) {
  if (mode !== 'play' || paused) return;
  waveT += dt;
  for (const s of stars) { s.y += s.v*dt; if (s.y > H) { s.y = -2; s.x = Math.random()*W; } }

  // ship: inertial movement (feel target: float, not tank)
  if (ship.alive) {
    if (stick) { // layout A: virtual stick sets velocity directly (arcade float preserved via damp)
      const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
      const m = Math.hypot(dx, dy), k = m > 4 ? Math.min(1, m/48) : 0;
      ship.vx = m ? dx/m*SHIP_MAXV*k : 0; ship.vy = m ? dy/m*SHIP_MAXV*k : 0;
      ship.x = Math.max(20, Math.min(W-20, ship.x + ship.vx*dt));
      ship.y = Math.max(H-220, Math.min(H-30, ship.y + ship.vy*dt));
    } else if (drag) { // layout B / mouse: ship follows pointer delta, velocity zeroed
      ship.x = Math.max(20, Math.min(W-20, drag.sx + (drag.x - drag.ox)));
      ship.y = Math.max(H-220, Math.min(H-30, drag.sy + (drag.y - drag.oy)));
      ship.vx = ship.vy = 0;
    } else {
      const ax = (keys.ArrowRight||keys.KeyD?1:0) - (keys.ArrowLeft||keys.KeyA?1:0);
      const ay = (keys.ArrowDown||keys.KeyS?1:0) - (keys.ArrowUp||keys.KeyW?1:0);
      ship.vx += ax*SHIP_ACC*dt; ship.vy += ay*SHIP_ACC*dt;
      ship.vx -= ship.vx*SHIP_DAMP*dt; ship.vy -= ship.vy*SHIP_DAMP*dt;
      ship.vx = Math.max(-SHIP_MAXV, Math.min(SHIP_MAXV, ship.vx));
      ship.vy = Math.max(-SHIP_MAXV, Math.min(SHIP_MAXV, ship.vy));
      ship.x = Math.max(20, Math.min(W-20, ship.x + ship.vx*dt));
      ship.y = Math.max(H-220, Math.min(H-30, ship.y + ship.vy*dt));
    }
    ship.invuln = Math.max(0, ship.invuln - dt);
    fireT -= dt;
    if ((fireHeld || (touchMode && layout === 'B')) && fireT <= 0) { fireGuns(); fireT = FIRE_EVERY; }
  } else {
    deadT += dt;
    if (deadT >= RESPAWN_S) {
      if (lives > 0) { ship.alive = true; ship.x = W/2; ship.y = SHIP_Y0; ship.vx = ship.vy = 0; ship.invuln = INVULN_S; }
      else { mode = 'gameover'; return; }
    }
  }
  jokeT = Math.max(0, jokeT - dt);

  // chickens: formation patterns (Galaxian-ish, readable — not danmaku)
  const wdef = CHAPTERS[chapter-1][waveIdx] || null;
  for (const c of chickens) {
    c.t += dt;
    if (c.enter) { // fly-in
      c.y += (c.by - c.y) * Math.min(1, 3*dt) + 40*dt;
      if (Math.abs(c.y - c.by) < 4) { c.y = c.by; c.enter = 0; }
      c.x = c.bx; continue;
    }
    if (c.dive) { // diving at ship
      c.x += c.dvx*dt; c.y += c.dvy*dt;
      if (c.y > H + 30) { c.dive = 0; c.y = -40; c.enter = 1; }
      continue;
    }
    if (!wdef) continue;
    if (wdef.pattern === 'straight') {
      c.x = c.bx + Math.sin(waveT*0.7)*130;
      c.y = Math.min(c.by + waveT*4, 300);
    } else if (wdef.pattern === 'swoop') {
      c.x = c.bx + Math.sin(waveT*1.1 + c.bx*0.01)*170;
      c.y = Math.min(c.by + Math.sin(waveT*0.9 + c.bx*0.02)*36 + waveT*6, 320);
    } else { // dive formation: mild sway; individuals peel off
      c.x = c.bx + Math.sin(waveT*0.5)*70;
      c.y = Math.min(c.by + waveT*3, 280);
    }
  }
  // dive scheduler
  if (wdef && wdef.pattern === 'dive') {
    diveT -= dt;
    if (diveT <= 0) {
      const cand = chickens.filter(c => !c.dive && !c.enter);
      if (cand.length) {
        const c = cand[(Math.random()*cand.length)|0];
        c.dive = 1;
        const dx = ship.x - c.x, dy = ship.y - c.y, d = Math.hypot(dx, dy) || 1;
        const sp = 240; c.dvx = dx/d*sp; c.dvy = Math.max(160, dy/d*sp);
      }
      diveT = 1.4 + Math.random();
    }
  }
  // egg drops (aimed-ish, readable speed)
  eggT -= dt;
  if (eggT <= 0 && chickens.length) {
    const c = chickens[(Math.random()*chickens.length)|0];
    if (!c.enter && c.y < ship.y - 40) {
      const dx = ship.x - c.x, dy = ship.y - c.y, d = Math.hypot(dx, dy) || 1;
      const spread = (Math.random()-.5)*0.35;
      eggs.push({x: c.x, y: c.y + 12, vx: (dx/d + spread)*EGG_V*0.5, vy: EGG_V});
    }
    eggT = (wdef ? wdef.eggEvery : 2.2) * (0.7 + Math.random()*0.6);
  }
  // wave cleared?
  if (!chickens.length && !boss) {
    waveIdx++;
    if (waveIdx < CHAPTERS[chapter-1].length) spawnWave();
    else spawnBoss();
  }

  if (boss) {
    boss.t += dt;
    boss.y += (110 - boss.y) * Math.min(1, 1.5*dt);
    boss.x = W/2 + Math.sin(boss.t*0.7)*240;
    boss.volley -= dt; boss.radial -= dt; boss.warn = Math.max(0, boss.warn - dt);
    if (boss.volley <= 0) { // aimed 3-egg volley
      for (let i = -1; i <= 1; i++) {
        const dx = ship.x - boss.x, dy = ship.y - boss.y, d = Math.hypot(dx, dy) || 1;
        eggs.push({x: boss.x, y: boss.y + 30, vx: dx/d*EGG_V*0.6 + i*60, vy: EGG_V*1.05});
      }
      boss.volley = 2.4;
    }
    if (boss.radial <= 0) { boss.warn = 0.7; boss.radial = 6.0; }
    if (boss.warn > 0 && boss.warn - dt <= 0.05) { // telegraph fires
      for (let i = 0; i < 12; i++) {
        const a = i/12*Math.PI*2;
        eggs.push({x: boss.x, y: boss.y + 20, vx: Math.cos(a)*EGG_V*0.7, vy: Math.abs(Math.sin(a))*EGG_V*0.7 + 60});
      }
    }
    if (boss.hp <= 0) {
      burst(boss.x, boss.y, 60, pack.foe2); score += 1000; boss = null;
      unlocked = Math.max(unlocked, Math.min(2, chapter + 1));
      localStorage.setItem('ci_proto_unlock_' + pack.id, unlocked);
      mode = chapter >= 2 ? 'win' : 'clear'; clearT = 0;
    }
  }

  // projectiles
  for (const b of bullets) { b.x += (b.vx||0)*dt; b.y += b.vy*dt; }
  for (const m of missiles) m.y += m.vy*dt;
  for (const e of eggs) { e.x += e.vx*dt; e.y += e.vy*dt; }
  for (const p of pickups) p.y += p.vy*dt;
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W+20);
  missiles = missiles.filter(m => m.y > -40);
  eggs = eggs.filter(e => e.y < H+20 && e.x > -20 && e.x < W+20);
  pickups = pickups.filter(p => p.y < H+20);

  // bullet/missile vs chickens
  const hitC = (b, dmg) => {
    for (const c of chickens) {
      if (Math.abs(b.x - c.x) < 24 && Math.abs(b.y - c.y) < 18) {
        c.hp -= dmg; burst(b.x, b.y, 4, pack.foe);
        if (c.hp <= 0) { killChicken(c); chickens = chickens.filter(k => k !== c); }
        return true;
      }
    }
    return false;
  };
  bullets = bullets.filter(b => !hitC(b, BULLET_DMG));
  missiles = missiles.filter(m => !hitC(m, MISSILE_DMG));
  // vs boss
  if (boss) {
    const hitB = b => Math.abs(b.x - boss.x) < 56 && Math.abs(b.y - boss.y) < 40;
    for (const b of bullets) if (hitB(b)) { boss.hp -= BULLET_DMG; b.y = -99; burst(b.x, b.y, 3, pack.foe2); }
    for (const m of missiles) if (hitB(m)) { boss.hp -= MISSILE_DMG; m.y = -99; burst(m.x, m.y, 12, pack.foe2); }
    bullets = bullets.filter(b => b.y > -20); missiles = missiles.filter(m => m.y > -40);
    // boss body collision
    if (ship.alive && ship.invuln <= 0 && Math.abs(ship.x - boss.x) < 50 && Math.abs(ship.y - boss.y) < 36) hitShip('boss');
  }
  // chicken body collision
  if (ship.alive && ship.invuln <= 0)
    for (const c of chickens)
      if (Math.abs(ship.x - c.x) < 26 && Math.abs(ship.y - c.y) < 20) { hitShip('chicken'); break; }
  // eggs vs ship
  if (ship.alive && ship.invuln <= 0)
    for (const e of eggs)
      if (Math.hypot(e.x - ship.x, e.y - ship.y) < SHIP_R + EGG_R) { hitShip('egg'); e.y = H + 99; break; }
  // pickups vs ship
  if (ship.alive)
    for (const p of pickups) {
      if (Math.abs(p.x - ship.x) < 26 && Math.abs(p.y - ship.y) < 22) {
        p.y = H + 99; score += 50;
        if (p.kind === 'gift') weaponLv = (weaponLv + 1) % pack.weapons.length; // cycle/upgrade

  SPR.banner = mkSpr(W, 96, bannerArt);
  SPR.star = [
    mkSpr(6, 6, g => { g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(3, 3, 1.3, 0, 7); g.fill(); }),
    mkSpr(9, 9, g => { const r = g.createRadialGradient(4.5, 4.5, 0, 4.5, 4.5, 4.5); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.45, 'rgba(255,255,255,.75)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 9, 9); }),
    mkSpr(15, 15, g => { const r = g.createRadialGradient(7.5, 7.5, 0, 7.5, 7.5, 7.5); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(230,240,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 15, 15);
      g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = .9;
      g.beginPath(); g.moveTo(7.5, 1); g.lineTo(7.5, 14); g.moveTo(1, 7.5); g.lineTo(14, 7.5); g.stroke(); })
  ];
  SPR.birdUp = mkSpr(56, 56, g => { g.translate(28, 30); birdArt(g, 1, 'up', false); });
  SPR.birdDn = mkSpr(56, 56, g => { g.translate(28, 30); birdArt(g, 1, 'down', false); });
  SPR.birdDive = mkSpr(56, 64, g => { g.translate(28, 36); birdArt(g, 1, 'dive', false); });
  SPR.boss = mkSpr(200, 190, g => bossArt(g, false));
  SPR.bossMad = mkSpr(200, 190, g => bossArt(g, true));
  SPR.ship = [0, 1, 2].map(lv => mkSpr(48, 56, g => { g.translate(24, 30); shipArt(g, lv); }));
  SPR.flame = [0, 1, 2].map(i => mkSpr(20, 30, g => flameArt(g, i)));
  SPR.bullet = mkSpr(20, 30, bulletArt);
  SPR.missile = mkSpr(24, 44, missileArt);
  SPR.egg = mkSpr(18, 22, eggArt);
  SPR.puff = mkSpr(32, 32, puffArt);
  SPR.gift = mkSpr(36, 36, giftArt);
  SPR.food = mkSpr(36, 36, foodArt);
}

function draw() {
  const now = performance.now() / 1000;
  const ddt = drawLast < 0 ? 0 : Math.min(0.1, now - drawLast);
  drawLast = now; drawT = now;
  if (SPR.packId !== pack.id) buildSprites();
  titleT0 = mode === 'title' ? (titleT0 < 0 ? drawT : titleT0) : -1;

  ctx.drawImage(SPR.bg, 0, 0);
  // planet / ringed moon silhouette — slow parallax drift, low in frame
  ctx.globalAlpha = .9;
  ctx.drawImage(SPR.planet, W * .82 - 120 + Math.sin(drawT * .045) * 12, H - 178 + Math.sin(drawT * .03) * 4);
  ctx.globalAlpha = 1;
  // stars: 3 tiers, twinkle, two parallax speeds (s.v scrolls in step)
  for (const s of stars) {
    ctx.globalAlpha = s.a * (.62 + .38 * Math.sin(drawT * s.tw + s.x * .7));
    ctx.drawImage(SPR.star[s.tier], s.x - s.o, s.y - s.o);
  }
  ctx.globalAlpha = 1;

  if (mode === 'title') return drawTitle();

  // pickups: icon + bob + pack glow ring + sparkles
  for (const p of pickups) {
    const y = p.y + Math.sin(drawT * 4 + p.x * .05) * 3;
    ctx.strokeStyle = rgba(pack.accent, .45 + .3 * Math.sin(drawT * 6 + p.x));
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, y, 15 + Math.sin(drawT * 5 + p.x) * 2.5, 0, 7); ctx.stroke();
    ctx.drawImage(p.kind === 'gift' ? SPR.gift : SPR.food, p.x - 18, y - 18);
    for (let i = 0; i < 3; i++) {
      const a = drawT * 2.6 + i * 2.1 + p.x * .01;
      ctx.globalAlpha = .35 + .55 * Math.abs(Math.sin(drawT * 4.5 + i * 2.3 + p.x));
      ctx.drawImage(SPR.star[1], p.x + Math.cos(a) * 14 - 4.5, y + Math.sin(a) * 12 - 4.5);
    }
    ctx.globalAlpha = 1;
  }
  // chickens
  for (const c of chickens) drawBird(c);
  // boss
  if (boss) {
    const mad = boss.hp < boss.max * .35;
    if (boss.warn > 0) { // telegraph ring (semantics kept)
      ctx.strokeStyle = rgba(pack.accent, .85); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(boss.x, boss.y, 74 + Math.sin(boss.t * 30) * 6, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(boss.x, boss.y, 64 + Math.sin(boss.t * 30) * 6, 0, 7); ctx.stroke();
    }
    const bs = mad ? SPR.bossMad : SPR.boss;
    ctx.drawImage(bs, boss.x - 100, boss.y - 104 + Math.sin(boss.t * 2.2) * 5);
    // framed segmented hp gauge (same rect/position)
    const bx = W / 2 - 160, frac = Math.max(0, boss.hp) / boss.max;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; rrect(bx - 4, 10, 328, 18, 5); ctx.fill();
    const seg = 20, sw = 320 / seg;
    for (let i = 0; i < seg; i++) {
      ctx.fillStyle = frac * seg > i
        ? (mad ? rgba(pack.accent, .7 + .3 * Math.sin(drawT * 10)) : pack.accent)
        : 'rgba(255,255,255,.09)';
      ctx.fillRect(bx + i * sw + 1, 14, sw - 2, 10);
    }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; rrect(bx - 4, 10, 328, 18, 5); ctx.stroke();
    txt(pack.boss, W / 2, 40, '#fff', 11, 'center');
  }
  // eggs: specular ovals w/ wobble
  for (const e of eggs) {
    ctx.save(); ctx.translate(e.x, e.y);
    ctx.rotate(Math.sin(drawT * 7 + e.x * .13 + e.y * .02) * .18);
    ctx.drawImage(SPR.egg, -9, -11);
    ctx.restore();
  }
  // bullets: glowing capsules tilted along velocity
  for (const b of bullets) {
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx || 0) + Math.PI / 2);
    ctx.drawImage(SPR.bullet, -10, -15);
    ctx.restore();
  }
  // missile smoke trail (draw-only pool)
  if (!paused) {
    puffAcc += ddt * 55 * missiles.length;
    while (puffAcc >= 1) {
      puffAcc -= 1;
      if (missiles.length && smoke.length < 160) {
        const m = missiles[smokeIdx++ % missiles.length];
        smoke.push({x: m.x + (Math.random() - .5) * 5, y: m.y + 18, r: 3.5 + Math.random() * 3, life: .5, max: .5});
      }
    }
    let sw2 = 0;
    for (const p of smoke) { p.y += 34 * ddt; p.r += 16 * ddt; p.life -= ddt; if (p.life > 0) smoke[sw2++] = p; }
    smoke.length = sw2;
  }
  for (const p of smoke) {
    ctx.globalAlpha = Math.max(0, p.life / p.max) * .4;
    ctx.drawImage(SPR.puff, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  ctx.globalAlpha = 1;
  // missiles: finned rockets
  for (const m of missiles) ctx.drawImage(SPR.missile, m.x - 12, m.y - 22);
  // ship (invuln blink gating unchanged)
  if (ship.alive && (ship.invuln <= 0 || (waveT * 16 | 0) % 2 === 0)) drawShip();
  // particles: tagged shapes (feather slivers / ship debris)
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    if (p.sh === 'feather') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.vy, p.vx) + p.spin);
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.ellipse(0, 0, p.s * 1.15, p.s * .38, 0, 0, 7); ctx.fill();
      ctx.restore();
    } else if (p.sh === 'debris') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin + p.life * 9);
      ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .35);
      ctx.restore();
    } else { ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.s, p.s); }
  }
  ctx.globalAlpha = 1;
  // ship-death shockwave ring + white flash (draw-only, keyed to deadT)
  if (mode === 'play' && !ship.alive) {
    const rt = deadT / .45;
    if (rt < 1) {
      ctx.globalAlpha = (1 - rt) * .9; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5 * (1 - rt) + 1;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 12 + rt * 95, 0, 7); ctx.stroke();
      ctx.globalAlpha = (1 - rt) * .5; ctx.strokeStyle = pack.accent; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 8 + rt * 70, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (deadT < .035) {
      ctx.fillStyle = `rgba(255,255,255,${(.55 * (1 - deadT / .035)).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  drawHUD();
  if (jokeT > 0 && pack.jokes) center2(pack.jokes[chapter - 1] || '', H - 120, '#8ce99a', 14);
  if (paused) banner('PAUSED');
  if (mode === 'clear') banner(`CHAPTER ${chapter} CLEAR — next: chapter ${chapter + 1}`);
  if (mode === 'gameover') banner('GAME OVER — R / click for title');
  if (mode === 'win') banner('ALL CHAPTERS CLEAR — R / click for title');
}
function drawBird(c) {
  if (c.dive) { // tucked wings + speed lines, slight lean into the dive
    ctx.save(); ctx.translate(c.x, c.y);
    ctx.rotate(Math.max(-.45, Math.min(.45, (c.dvx || 0) * .0012)));
    ctx.drawImage(SPR.birdDive, -28, -36);
    ctx.restore();
    return;
  }
  const spr = ((c.t * (c.enter ? 11 : 7) | 0) % 2) ? SPR.birdUp : SPR.birdDn;
  ctx.drawImage(spr, c.x - 28, c.y - 30);
}
function drawShip() {
  ctx.save(); ctx.translate(ship.x, ship.y);
  ctx.rotate(Math.max(-.16, Math.min(.16, ship.vx / SHIP_MAXV * .16))); // bank into motion
  const fl = SPR.flame[(drawT * 24 | 0) % 3];
  ctx.drawImage(fl, -10, 13, 20, 24 + Math.sin(drawT * 31) * 4);
  ctx.drawImage(SPR.ship[weaponLv], -24, -30);
  ctx.restore();
}
function drawHUD() {
  txt(`SCORE ${score}`, 14, 22, '#fff', 14);
  txt(`LIVES ${'♥'.repeat(Math.max(0,lives))}`, 14, 42, '#ff8787', 14);
  txt(`${pack.weapons[weaponLv]}`, 14, 62, pack.bullet, 14);
  txt(`MISSILES ${missileN}`, 14, 82, '#ffd43b', 14);
  txt(`CH ${chapter} · ${boss ? 'BOSS' : 'WAVE ' + (waveIdx+1) + '/' + CHAPTERS[chapter-1].length}`, W-14, 22, '#fff', 14, 'right');
  txt(`[${pack.id.toUpperCase()}]`, W-14, 42, pack.accent, 14, 'right');
  txt(touchMode
    ? (layout === 'A' ? 'LAYOUT A: LEFT-half stick move · RIGHT-half hold fire · MISSILE above — INTERNAL mechanics proof'
                      : 'LAYOUT B: DRAG move · auto-fire ON · MISSILE btn bottom-right — INTERNAL mechanics proof')
    : 'ARROWS/WASD move · SPACE/Z/LMB fire · X/SHIFT/RMB missile · ESC pause — INTERNAL mechanics proof', 14, H-10, '#889', 11);
  if (touchMode && mode === 'play') {
    orbBtn(missileBtn(), pack.accent, SPR.missile, missileN > 0, false, 'MISSILE');
    if (layout === 'A') {
      orbBtn(FIRE_BTN_A, '#8ce99a', SPR.bullet, true, firePtrs.size > 0, 'FIRE');
      if (stick) { // translucent base ring + clamped knob
        const dx = stick.x - stick.ox, dy = stick.y - stick.oy, m = Math.hypot(dx, dy);
        const cl = m > 48 ? 48 / m : 1, kx = stick.ox + dx * cl, ky = stick.oy + dy * cl;
        ctx.fillStyle = 'rgba(255,255,255,.06)';
        ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 48, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 48, 0, 7); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(stick.ox - 48, stick.oy); ctx.lineTo(stick.ox - 38, stick.oy);
        ctx.moveTo(stick.ox + 38, stick.oy); ctx.lineTo(stick.ox + 48, stick.oy);
        ctx.moveTo(stick.ox, stick.oy - 48); ctx.lineTo(stick.ox, stick.oy - 38);
        ctx.moveTo(stick.ox, stick.oy + 38); ctx.lineTo(stick.ox, stick.oy + 48);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.3)';
        ctx.beginPath(); ctx.arc(kx, ky, 15, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.45)';
        ctx.beginPath(); ctx.arc(kx - 3, ky - 4, 8, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(kx, ky, 15, 0, 7); ctx.stroke();
      }
    }
  }
}
function orbBtn(r, col, spr, enabled, pressed, label) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2, rad = Math.min(r.w, r.h) / 2 - 3;
  ctx.globalAlpha = enabled ? 1 : .35;
  ctx.fillStyle = rgba(col, pressed ? .42 : .16);
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = pressed ? 3 : 2;
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.stroke();
  ctx.strokeStyle = rgba(col, .4); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, rad - 5, 0, 7); ctx.stroke();
  if (spr) {
    const sh = spr.height * .62, sw = spr.width * .62;
    ctx.drawImage(spr, cx - sw / 2, cy - sh / 2 - 4, sw, sh);
  }
  ctx.globalAlpha = 1;
  txt(label, cx, cy + rad - 7, col, 8, 'center');
}
function banner(t) {
  ctx.drawImage(SPR.banner, 0, H / 2 - 48);
  ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillText(t, W / 2 + 2, H / 2 + 11);
  ctx.fillStyle = '#fff'; ctx.fillText(t, W / 2, H / 2 + 9);
  ctx.textAlign = 'left';
}
function center2(t, y, col, size) {
  ctx.fillStyle = col; ctx.font = `${size}px monospace`; ctx.textAlign = 'center';
  ctx.fillText(t, W/2, y); ctx.textAlign = 'left';
}
function drawTitle() {
  const t = drawT - titleT0;
  // pack-branded marquee: shadow offset + accent glow
  ctx.textAlign = 'center'; ctx.font = 'bold 46px monospace';
  ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillText(pack.title, W / 2 + 3, 123);
  ctx.shadowColor = pack.accent; ctx.shadowBlur = 18;
  ctx.fillStyle = pack.accent; ctx.fillText(pack.title, W / 2, 120);
  ctx.shadowBlur = 0; ctx.textAlign = 'left';
  // flanking pack birds
  ctx.drawImage(SPR.birdDn, W * .14 - 28, 92);
  ctx.save(); ctx.translate(W * .86, 0); ctx.scale(-1, 1);
  ctx.drawImage(SPR.birdUp, -28, 92); ctx.restore();
  // ship sprite fly-in (draw clock), then hover
  const fp = Math.min(1, t / 1.5), ease = 1 - Math.pow(1 - fp, 3);
  const sx = -70 + (W / 2 + 70) * ease, sy = 300 - 68 * ease + Math.sin(drawT * 2.2) * 6 * fp;
  ctx.save(); ctx.translate(sx, sy);
  ctx.rotate((1 - ease) * .55 + Math.sin(drawT * 1.8) * .06 * fp);
  ctx.drawImage(SPR.flame[(drawT * 24 | 0) % 3], -10, 13, 20, 24 + Math.sin(drawT * 31) * 4);
  ctx.drawImage(SPR.ship[0], -24, -30);
  ctx.restore();

  center2(pack.sub, 152, '#aab', 15);
  center2('— INTERNAL mechanics proof · not for public ship —', 178, '#667', 12);
  // chapter select
  btn(BTN.ch1, 'CH 1', titleSel === 1);
  btn(BTN.ch2, unlocked >= 2 ? 'CH 2' : 'CH 2 🔒', titleSel === 2 && unlocked >= 2);
  btn(BTN.start, '▶ START', true);
  btn(BTN.pack, 'PACK: ' + pack.id.toUpperCase() + '  (T / click to swap)', false);
  btn(BTN.layout, 'TOUCH LAYOUT: ' + layout + '  (L / click to swap)', false);
  center2('ENTER start · 1/2 chapter · T swap pack · L touch layout', 478, '#889', 13);
  center2('replica = CI2-era formula · cluck = original IP (Cluck Horizon) · layout A twin-thumb / B one-thumb', 500, '#667', 12);
}
function btn(r, t, on) { // neon-outlined capsule
  ctx.fillStyle = on ? rgba(pack.accent, .24) : 'rgba(18,22,38,.6)';
  rrect(r.x, r.y, r.w, r.h, 12); ctx.fill();
  ctx.strokeStyle = on ? pack.accent : 'rgba(255,255,255,.32)';
  ctx.lineWidth = on ? 2 : 1.2;
  if (on) { ctx.shadowColor = pack.accent; ctx.shadowBlur = 10; }
  rrect(r.x, r.y, r.w, r.h, 12); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = on ? '#fff' : '#ccd';
  ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
  ctx.fillText(t, r.x + r.w/2, r.y + r.h/2 + 5); ctx.textAlign = 'left';
}

// ---------------- main loop ----------------
mode = 'title';
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(0.1, (now - last)/1000); last = now;
  while (acc >= DT) { step(DT); acc -= DT; }
  if (mode === 'clear') { clearT += DT; if (clearT >= CHAPTER_CLEAR_S) { chapter++; waveIdx = 0; killsInChapter = 0; jokeT = 2.2; mode = 'play'; spawnWave(); } }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------- verification hook (read-only; not gameplay) ----------------
window.__proto = {
  get mode(){return mode}, get pack(){return pack.id}, get chapter(){return chapter},
  get wave(){return waveIdx === undefined ? null : waveIdx+1}, get wavesTotal(){return chapter ? CHAPTERS[chapter-1].length : null},
  get score(){return score}, get lives(){return lives}, get missiles(){return missileN},
  get weapon(){return weaponLv}, get weaponName(){return pack.weapons[weaponLv]},
  get shipX(){return ship ? ship.x : null}, get shipY(){return ship ? ship.y : null},
  get shipAlive(){return ship ? ship.alive : null}, get invuln(){return ship ? ship.invuln : 0},
  get chickens(){return chickens ? chickens.map(c => ({x:c.x, y:c.y, hp:c.hp, dive:!!c.dive})) : []},
  get eggs(){return eggs ? eggs.length : 0}, get pickups(){return pickups ? pickups.map(p => ({x:p.x, y:p.y, kind:p.kind})) : []},
  get bossHp(){return boss ? boss.hp : null}, get bossMax(){return boss ? boss.max : null},
  get bossX(){return boss ? boss.x : null}, get bossWarn(){return boss ? boss.warn : 0},
  get unlocked(){return unlocked}, get paused(){return paused},
  get layout(){return layout}, get touchMode(){return touchMode},
  get stick(){return stick ? {ox:stick.ox, oy:stick.oy, x:stick.x, y:stick.y} : null},
  get firePtrs(){return firePtrs.size},
  get eggList(){return eggs ? eggs.map(e => ({x:e.x, y:e.y})) : []},
  BTN, PACKS: Object.keys(PACKS)
};
</script>
