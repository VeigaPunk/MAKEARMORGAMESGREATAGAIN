<script>
"use strict";
/* maga-proto: Burger Tycoon — core-loop mechanics proof.
 * Spec: 01-design-docs/02-concept-specs/03-mcdonalds-game.md
 * Loop: 4 panes share one economy; throughput under board pressure; dirty options
 * trade short-term gain for backlash; cash<=0 or rep<=0 -> game over. Sim runs idle.
 * All numbers DECLARED GUESSES (dossier: thresholds/formulas TBD from ARCADE).
 * Causal chain: Farm grows crops -> cattle eat crops & are SLAUGHTERED into patties
 * (cattle consumed) -> Restaurant sells patties for cash -> overhead drains cash ->
 * board punishes low profit. Overspend or stall = bankruptcy; backlash = rep death.
 */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud'), tabsEl = document.getElementById('tabs'), logEl = document.getElementById('log');

const PANES = ['FARMLAND','FEEDLOT','RESTAURANT','HQ'];
let pane = 0;

// ---- economy state (rates per second; constants TBD) ----
const S = {
  cash: 500, rep: 70, backlash: 0,
  crops: 20, cattle: 10, patties: 10,
  demand: 1.0, boardPressure: 0, disease: 0,
  over: false, t: 0,
  rates: { crop: 1.2, herd: 0.3, patty: 0.9, sell: 1.0, profitPerBurger: 5, overhead: 4 },
  dirty: { deforest:0, cheapFeed:0, cutCorners:0 },
  lastProfit: 0,
};
function log(m){ const d=document.createElement('div'); d.textContent=`[${S.t.toFixed(0)}s] ${m}`; logEl.prepend(d); while(logEl.children.length>14) logEl.lastChild.remove(); }

function tick(dt) {
  if (S.over) return;
  S.t += dt;
  const d = S.dirty;
  // FARMLAND: crops grow (deforest multiplies); herd grows while crops feed it
  const cropRate = S.rates.crop * (d.deforest ? 2.2 : 1);
  S.crops += cropRate * dt;
  if (S.crops > 1 && S.cattle > 0) {
    const graze = Math.min(S.crops, S.rates.herd * dt * 2);
    S.crops -= graze; S.cattle += S.rates.herd * dt;
  }
  // FEEDLOT: slaughter cattle -> patties (CATTLE CONSUMED); needs crop feed too
  const capacity = S.rates.patty * (d.cheapFeed ? 1.8 : 1);
  const pattyRate = Math.min(S.cattle * 0.5, S.crops * 0.5, capacity);
  if (pattyRate > 0) {
    S.patties += pattyRate * dt;
    S.cattle -= pattyRate * 0.5 * dt;   // slaughter consumes the herd
    S.crops  -= pattyRate * 0.5 * dt;   // feed consumed
  }
  if (d.cheapFeed) S.disease += 0.6 * dt;
  if (S.disease > 20) { S.disease = 0; S.cattle *= 0.5; S.rep -= 12; S.backlash += 15; log('DISEASE OUTBREAK: herd culled, rep -12'); }
  // RESTAURANT: patties -> cash at demand-limited rate
  const sellRate = Math.min(S.patties, S.rates.sell * S.demand * (d.cutCorners ? 1.5 : 1));
  if (sellRate > 0) {
    S.patties -= sellRate * dt;
    const margin = S.rates.profitPerBurger * (d.cutCorners ? 1.6 : 1);
    const earn = sellRate * margin * dt;
    S.cash += earn; S.lastProfit = earn / dt;
  } else S.lastProfit = 0;
  // OVERHEAD: wages + rent always drain — the real loss pressure
  S.cash -= S.rates.overhead * dt;
  // HQ: board pressure — rises fast when profit stalls; interventions cost cash
  const stall = S.lastProfit <= S.rates.overhead ? 1.4 : 0.4;
  S.boardPressure += stall * dt * (S.lastProfit > S.rates.overhead * 2 ? -1 : 1);
  S.boardPressure = Math.max(0, S.boardPressure);
  if (S.boardPressure > 100) { S.cash -= 60; S.boardPressure = 40; log('BOARD INTERVENTION: emergency loan cost -$60'); }
  // backlash dynamics
  let bl = 0;
  if (d.deforest) bl += 1.2; if (d.cheapFeed) bl += 0.8; if (d.cutCorners) bl += 1.0;
  S.backlash += (bl - 0.35) * dt; S.backlash = Math.max(0, Math.min(100, S.backlash));
  if (S.backlash > 60) S.rep -= 1.5 * dt;
  if (S.backlash > 85) S.rep -= 3 * dt;
  S.rep = Math.max(0, Math.min(100, S.rep));
  if (S.rep <= 0) return gameOver('REPUTATION COLLAPSE — activists shut you down');
  if (S.cash <= 0) { S.cash = 0; return gameOver('BANKRUPT — overhead + board ate the company'); }
}
function gameOver(why){ S.over = true; log('GAME OVER: ' + why); }

// ---- actions ----
let hits = [];
const ACTIONS = {
  farm: [
    ['Sow soy field (+15 crops)', () => { S.crops += 15; }],
    ['Buy cattle (+5 head, -$80)', () => { if (S.cash>=80){S.cash-=80;S.cattle+=5;} }],
    ['DIRTY: Bulldoze rainforest (2.2x crops, +backlash)', () => { S.dirty.deforest = S.dirty.deforest?0:1; }],
  ],
  feed: [
    ['Emergency slaughter (+4 patties, -2 cattle)', () => { if (S.cattle>=2){S.cattle-=2;S.patties+=4;} }],
    ['DIRTY: Cheap feed (1.8x patties, disease risk)', () => { S.dirty.cheapFeed = S.dirty.cheapFeed?0:1; }],
  ],
  rest: [
    ['Promo push (+0.3 demand, -$40)', () => { if (S.cash>=40){S.cash-=40;S.demand=Math.min(3,S.demand+0.3);} }],
    ['DIRTY: Cut corners (1.6x margin, +backlash)', () => { S.dirty.cutCorners = S.dirty.cutCorners?0:1; }],
  ],
  hq: [
    ['Marketing campaign (+0.6 demand, -$120)', () => { if (S.cash>=120){S.cash-=120;S.demand=Math.min(3,S.demand+0.6);} }],
    ['PR spin (-15 backlash, -$100)', () => { if (S.cash>=100){S.cash-=100;S.backlash=Math.max(0,S.backlash-15);} }],
    ['DIRTY: Bribe officials (-25 backlash, -$200, -4 rep)', () => { if (S.cash>=200){S.cash-=200;S.backlash=Math.max(0,S.backlash-25);S.rep-=4;} }],
  ],
};
const PANE_KEY = ['farm','feed','rest','hq'];

PANES.forEach((p,i)=>{ const b=document.createElement('button'); b.textContent=`${i+1} ${p}`; b.onclick=()=>{pane=i;draw();}; tabsEl.appendChild(b); });
addEventListener('keydown', e=>{ const n=parseInt(e.key); if(n>=1&&n<=4){pane=n-1;draw();} });
cv.addEventListener('click', e=>{
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*(cv.width/r.width), y=(e.clientY-r.top)*(cv.height/r.height);
  for (const h of hits) if (x>h.x&&x<h.x+h.w&&y>h.y&&y<h.y+h.h){ h.fn(); log(h.label); draw(); return; }
});

/* ===================== presentation layer (draw-only; sim untouched) ===================== */
const SX=608, SY=170, SW=328, SH=226;            // scene viewport (clear of card hit rects)
const PANE_TINT=['rgba(120,160,60,.07)','rgba(160,110,60,.07)','rgba(200,120,60,.08)','rgba(60,90,160,.08)'];
const ACT_ICON={farm:['wheat','cow','dozer'],feed:['cleaver','feedbag'],rest:['mega','burger'],hq:['megabadge','spin','cash']};
const DIRTY_FLAG={farm:'deforest',feed:'cheapFeed',rest:'cutCorners',hq:null};
const PANE_ICON=['wheat','cow','burger','tower'];
const meterPrev={}, meterAnim={};
let cardFlash={i:-1,t:-9}, lastFloatT=-9;
const floats=[];
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---- cached static art (built once at load) ---- */
const bgCv=document.createElement('canvas');bgCv.width=cv.width;bgCv.height=cv.height;
{
  const b=bgCv.getContext('2d');
  const g=b.createLinearGradient(0,0,0,cv.height);
  g.addColorStop(0,'#f2e9d4');g.addColorStop(.55,'#e9dec4');g.addColorStop(1,'#dcc9a4');
  b.fillStyle=g;b.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<900;i++){b.fillStyle=`rgba(120,90,40,${(i%7)*0.006+0.008})`;b.fillRect((i*97)%960,(i*57)%420,1.4,1.4);}
  const v=b.createRadialGradient(480,190,140,480,210,560);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(60,40,10,.28)');
  b.fillStyle=v;b.fillRect(0,0,cv.width,cv.height);
}
const hazCv=document.createElement('canvas');hazCv.width=hazCv.height=16;
{
  const h=hazCv.getContext('2d');
  h.fillStyle='#241d12';h.fillRect(0,0,16,16);
  h.strokeStyle='#8a6a1a';h.lineWidth=4;
  h.beginPath();h.moveTo(-4,20);h.lineTo(20,-4);h.moveTo(4,28);h.lineTo(28,4);h.stroke();
}
const HAZ=ctx.createPattern(hazCv,'repeat');
const cardGC=ctx.createLinearGradient(0,80,0,128);cardGC.addColorStop(0,'#5d7ea8');cardGC.addColorStop(1,'#3c5a80');
const cardGD=ctx.createLinearGradient(0,80,0,128);cardGD.addColorStop(0,'#4a3a20');cardGD.addColorStop(1,'#33270f');
const plateG=ctx.createLinearGradient(0,14,0,52);plateG.addColorStop(0,'#2e3440');plateG.addColorStop(1,'#1c2028');
const clockG=ctx.createLinearGradient(0,20,0,44);clockG.addColorStop(0,'#232830');clockG.addColorStop(1,'#14171c');
const skyFC=ctx.createLinearGradient(0,SY,0,SY+SH);skyFC.addColorStop(0,'#8fd0e8');skyFC.addColorStop(.6,'#cfe8c8');skyFC.addColorStop(1,'#e8e0b0');
const skyFD=ctx.createLinearGradient(0,SY,0,SY+SH);skyFD.addColorStop(0,'#e07840');skyFD.addColorStop(.55,'#a84828');skyFD.addColorStop(1,'#5a2a1a');
const skyLC=ctx.createLinearGradient(0,SY,0,SY+SH);skyLC.addColorStop(0,'#c8d8d0');skyLC.addColorStop(1,'#a8b8a0');
const skyLD=ctx.createLinearGradient(0,SY,0,SY+SH);skyLD.addColorStop(0,'#9aa0a0');skyLD.addColorStop(1,'#787c74');
const skyR=ctx.createLinearGradient(0,SY,0,SY+SH);skyR.addColorStop(0,'#f0c890');skyR.addColorStop(1,'#d8a060');
const skyH=ctx.createLinearGradient(0,SY,0,SY+SH);skyH.addColorStop(0,'#0c1226');skyH.addColorStop(1,'#1c2a4a');
const winG=ctx.createLinearGradient(0,SY+SH*0.42,0,SY+SH*0.80);winG.addColorStop(0,'#ffd890');winG.addColorStop(1,'#c89040');
const meterSheen={};
const meterFill={};
function meterGrad(col,w){const k=col+w;return meterFill[k]||(meterFill[k]=(()=>{const g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,col);g.addColorStop(1,'#ffd27a');return g;})());}

/* ---- small hand-drawn icon set (paths only) ---- */
function icon(name,x,y,s,col){
  ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=Math.max(1.4,s*0.14);ctx.lineCap='round';ctx.lineJoin='round';
  const u=s/10;
  switch(name){
    case 'wheat':
      ctx.beginPath();ctx.moveTo(0,5*u);ctx.lineTo(0,-5*u);ctx.stroke();
      for(let k=0;k<3;k++){const yy=-4*u+k*2.6*u;
        ctx.beginPath();ctx.ellipse(-1.6*u,yy,1.7*u,0.9*u,-0.7,0,7);ctx.fill();
        ctx.beginPath();ctx.ellipse(1.6*u,yy,1.7*u,0.9*u,0.7,0,7);ctx.fill();}
      break;
    case 'cow':
      ctx.beginPath();ctx.ellipse(0,0.5*u,4.6*u,2.8*u,0,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(4.4*u,-1.6*u,1.7*u,0,7);ctx.fill();
      ctx.fillRect(-3.4*u,2.6*u,1.1*u,2.6*u);ctx.fillRect(2.2*u,2.6*u,1.1*u,2.6*u);
      ctx.beginPath();ctx.moveTo(3.4*u,-3*u);ctx.lineTo(2.6*u,-4*u);ctx.moveTo(5.4*u,-3*u);ctx.lineTo(6.2*u,-4*u);ctx.stroke();
      break;
    case 'dozer':
      ctx.fillRect(-4.6*u,1.6*u,6.4*u,2.6*u);
      ctx.fillRect(-3.4*u,-1.8*u,3.4*u,3.4*u);
      ctx.beginPath();ctx.moveTo(1.8*u,0.6*u);ctx.lineTo(5*u,-1.6*u);ctx.lineTo(5*u,3*u);ctx.lineTo(1.8*u,3*u);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.arc(-2.8*u,4.4*u,1*u,0,7);ctx.arc(0.2*u,4.4*u,1*u,0,7);ctx.fill();
      break;
    case 'cleaver':
      ctx.beginPath();ctx.moveTo(-4.4*u,-3.4*u);ctx.lineTo(2.4*u,-3.4*u);ctx.lineTo(3.6*u,1.4*u);ctx.lineTo(-4.4*u,1.4*u);ctx.closePath();ctx.fill();
      ctx.fillRect(2.6*u,1*u,1.6*u,4.4*u);
      break;
    case 'feedbag':
      ctx.beginPath();ctx.moveTo(-3.4*u,4.6*u);ctx.lineTo(-2.4*u,-2.6*u);ctx.lineTo(2.4*u,-2.6*u);ctx.lineTo(3.4*u,4.6*u);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(-2.6*u,-2.6*u);ctx.lineTo(2.6*u,-2.6*u);ctx.stroke();
      ctx.beginPath();ctx.arc(0,1*u,1.2*u,0,7);ctx.stroke();
      break;
    case 'mega':
      ctx.beginPath();ctx.moveTo(-4.4*u,1.4*u);ctx.lineTo(3.4*u,-2.8*u);ctx.lineTo(3.4*u,3.4*u);ctx.lineTo(-4.4*u,2.6*u);ctx.closePath();ctx.fill();
      ctx.fillRect(-4.8*u,0.6*u,1.6*u,3.2*u);
      ctx.beginPath();ctx.moveTo(4.6*u,-2.4*u);ctx.lineTo(5.8*u,-3.4*u);ctx.moveTo(4.8*u,0.4*u);ctx.lineTo(6.2*u,0.4*u);ctx.stroke();
      break;
    case 'megabadge':
      ctx.beginPath();ctx.moveTo(-4.4*u,1.4*u);ctx.lineTo(2.2*u,-2.2*u);ctx.lineTo(2.2*u,3*u);ctx.lineTo(-4.4*u,2.6*u);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.arc(3.8*u,-2.6*u,2*u,0,7);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.45)';ctx.font=`bold ${Math.round(4*u)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',3.8*u,-2.6*u);
      break;
    case 'burger':
      ctx.beginPath();ctx.ellipse(0,-1.8*u,4.6*u,2.4*u,0,Math.PI,0);ctx.fill();
      ctx.fillRect(-4.6*u,-0.6*u,9.2*u,1.4*u);
      ctx.beginPath();ctx.moveTo(-4.4*u,1.4*u);
      for(let k=0;k<5;k++)ctx.lineTo(-4.4*u+(k+0.5)*1.76*u,(k%2?2.4:1.2)*u);
      ctx.lineTo(4.4*u,1.4*u);ctx.stroke();
      ctx.fillRect(-4.2*u,3*u,8.4*u,1.6*u);
      break;
    case 'cash':
      rr(-4.6*u,-3*u,9.2*u,6*u,1*u);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.font=`bold ${Math.round(5*u)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,0.2*u);
      break;
    case 'spin':
      ctx.beginPath();ctx.arc(0,0,3.6*u,0.6,4.4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(3.6*u*Math.cos(4.4),3.6*u*Math.sin(4.4));ctx.lineTo(3.6*u*Math.cos(4.4)-2.4*u,3.6*u*Math.sin(4.4)-0.6*u);ctx.lineTo(3.6*u*Math.cos(4.4)+0.4*u,3.6*u*Math.sin(4.4)-2.2*u);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.arc(0,0,3.6*u,3.8,7.0);ctx.stroke();
      break;
    case 'tower':
      ctx.fillRect(-3.4*u,-4.6*u,6.8*u,9.2*u);
      ctx.fillStyle='rgba(0,0,0,.5)';
      for(let r2=0;r2<3;r2++)for(let c2=0;c2<2;c2++)ctx.fillRect(-2.4*u+c2*3*u,-3.4*u+r2*2.8*u,1.4*u,1.4*u);
      break;
    case 'warn':
      ctx.beginPath();ctx.moveTo(0,-4.6*u);ctx.lineTo(4.6*u,3.6*u);ctx.lineTo(-4.6*u,3.6*u);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(-0.6*u,-2.2*u,1.2*u,3*u);ctx.fillRect(-0.6*u,1.6*u,1.2*u,1.2*u);
      break;
  }
  ctx.restore();
}

/* ---- scene props ---- */
function cloud(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,7*s,0,7);ctx.arc(x+9*s,y-3*s,8*s,0,7);ctx.arc(x+18*s,y,6.5*s,0,7);ctx.fill();}
function barn(x,y,w,h){ctx.fillStyle='#7a2e22';ctx.fillRect(x,y,w,h);ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+w/2,y-h*0.55);ctx.lineTo(x+w+3,y);ctx.closePath();ctx.fillStyle='#5a1f16';ctx.fill();ctx.fillStyle='#3a140e';ctx.fillRect(x+w*0.36,y+h*0.4,w*0.28,h*0.6);}
function silo(x,y,w,h){ctx.fillStyle='#9aa0a8';ctx.fillRect(x,y,w,h);ctx.beginPath();ctx.arc(x+w/2,y,w/2,Math.PI,0);ctx.fill();ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x+w*0.6,y,w*0.4,h);}
function cowS(x,y,s){ctx.fillStyle='#241a12';ctx.beginPath();ctx.ellipse(x,y,10*s,5.5*s,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+9*s,y-3*s,3.4*s,0,7);ctx.fill();ctx.fillRect(x-6*s,y+4*s,2*s,4.5*s);ctx.fillRect(x+4*s,y+4*s,2*s,4.5*s);}
function person(x,py,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,py-13*s,2.6*s,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x,py-10*s);ctx.lineTo(x-3*s,py);ctx.lineTo(x+3*s,py);ctx.closePath();ctx.fill();}
function smokePuff(x,y,r,a){ctx.fillStyle=`rgba(70,64,60,${a})`;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.arc(x+r*0.7,y-r*0.4,r*0.7,0,7);ctx.fill();}

/* ---- pane scenes (clipped to SX,SY,SW,SH) ---- */
function scFarm(x,y,w,h,d){
  ctx.fillStyle=d?skyFD:skyFC;ctx.fillRect(x,y,w,h);
  if(!d){ctx.fillStyle='#f4e2a0';ctx.beginPath();ctx.arc(x+w-52,y+30,16,0,7);ctx.fill();}
  else{ctx.fillStyle='#ff9a50';ctx.beginPath();ctx.arc(x+w-52,y+30,14,0,7);ctx.fill();ctx.fillStyle='rgba(255,120,40,.25)';ctx.beginPath();ctx.arc(x+w-52,y+30,22,0,7);ctx.fill();}
  const ct=S.t*(d?4:9);
  cloud(x+((ct*1.3)%(w+80))-40,y+26,1.1,d?'rgba(90,60,50,.5)':'rgba(255,255,255,.85)');
  cloud(x+((ct*0.8+140)%(w+80))-40,y+48,0.8,d?'rgba(90,60,50,.4)':'rgba(255,255,255,.7)');
  ctx.fillStyle=d?'#2a1a12':'#4a7a3a';
  ctx.beginPath();ctx.moveTo(x,y+h*0.55);
  for(let i=0;i<=16;i++)ctx.lineTo(x+i*w/16,y+h*0.55-((i*37)%13));
  ctx.lineTo(x+w,y+h*0.55);ctx.lineTo(x+w,y+h*0.62);ctx.lineTo(x,y+h*0.62);ctx.closePath();ctx.fill();
  barn(x+18,y+h*0.42,52,34);silo(x+76,y+h*0.34,16,52);
  ctx.fillStyle=d?'#6a4a28':'#7a9a4a';ctx.fillRect(x,y+h*0.62,w,h*0.38);

function scRest(x,y,w,h,d){

function meter(x,y,w,v,max,col,label){
