<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clashbound — arena TCG prototype</title>
<style>
  :root { --bg:#0e1118; --panel:#171d29; --panel-hi:#202a3a; --card:#273244; --line:#3b4b63; --acc:#f2b84b; --acc-hi:#ffd978; --cyan:#62d7e8; --danger:#ef6d79; --txt:#edf3fb; --dim:#9eacc0; }
  * { box-sizing: border-box; }
  body { margin:0; background:radial-gradient(circle at 50% -10%,#263247 0,#0e1118 48%); color:var(--txt); font:14px/1.4 system-ui,sans-serif; }
  #app { max-width:1100px; margin:0 auto; padding:12px; }
  h1 { font-size:20px; letter-spacing:.08em; color:var(--acc); margin:4px 0; }
  .bar { display:flex; gap:16px; align-items:center; background:var(--panel); border:1px solid #273449; border-radius:8px; padding:8px 12px; margin:6px 0; }
  .bar b { color:var(--acc-hi); }
  .board { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; min-height:110px; background:#111722; border:1px solid #202c3d; border-radius:8px; padding:8px; }
  .slot { border:1px dashed #3a475b; border-radius:6px; min-height:96px; display:flex; align-items:center; justify-content:center; }
  .minion { background:var(--card); border:2px solid var(--line); border-radius:6px; width:100%; height:100%; padding:6px; cursor:pointer; position:relative; }
  .minion.guard { border-color:#6d9ee8; }
  .minion.sick { opacity:.55; }
  .minion.canatk { border-color:var(--acc); box-shadow:0 0 12px #f2b84b88; }
  .minion.selected { outline:3px solid var(--acc-hi); }
  .minion.targetable { outline:3px solid var(--danger); cursor:crosshair; }
  .stats { position:absolute; bottom:4px; right:6px; font-weight:700; }
  .kw { font-size:10px; color:var(--cyan); letter-spacing:.02em; }
  .hand { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:6px; width:120px; padding:8px; cursor:pointer; }
  .card:hover { border-color:var(--acc); transform:translateY(-2px); }
  .card.unaffordable { opacity:.45; cursor:not-allowed; }
  .cost { display:inline-block; background:#315d91; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:700; margin-right:6px; }
  .name { font-weight:600; font-size:12px; }
  .txt { font-size:11px; color:var(--dim); margin-top:4px; }
  button { background:var(--acc); color:#10151d; border:0; border-radius:6px; padding:8px 16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #log { background:#090c12; border:1px solid #202c3d; border-radius:8px; padding:8px 12px; height:160px; overflow-y:auto; font:12px/1.5 ui-monospace,monospace; color:var(--dim); }
  #log .new { color:var(--txt); }
  .cp { display:inline-flex; align-items:center; gap:5px; min-width:160px; font-size:24px; line-height:1; font-weight:900; letter-spacing:.06em; color:var(--acc-hi); text-shadow:0 0 14px #f2b84b55; }
  .cp-label { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.14em; }
  .pip { width:10px; height:10px; border:1px solid #52627b; border-radius:50%; display:inline-block; background:#10151d; box-shadow:inset 0 0 0 2px #10151d; }
  .pip.on { background:var(--acc); border-color:var(--acc-hi); box-shadow:0 0 6px #f2b84b88; }
  .pip.on.mine { background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 6px #62d7e888; }
  .cplabel { color:var(--dim); font-size:10px; letter-spacing:.1em; }
  #clashprompt { display:none; gap:10px; align-items:center; background:#3a1f28; border:2px solid var(--danger); border-radius:8px; padding:10px 14px; margin:6px 0; }
  #clashprompt #clashinfo { font-weight:700; color:var(--danger); }
  #clashprompt button { background:var(--danger); color:#fff; }
  #clashprompt #decline { background:#52627b; }
  .contest { display:flex; flex-direction:column; gap:5px; min-width:210px; }
  .pips { display:flex; gap:4px; }
  .phase { color:var(--cyan); font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:5px 9px; border-left:3px solid var(--cyan); background:#16313a; border-radius:4px; }
  #mybar { border-color:#755829; box-shadow:0 0 12px #f2b84b22; }
  .legend { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; background:#121a26; border:1px solid #2d3b50; border-radius:6px; padding:7px 10px; margin:6px 0; color:var(--dim); font-size:12px; }
  .legend strong { color:var(--acc-hi); text-transform:uppercase; letter-spacing:.1em; font-size:10px; }
  .legend b { color:var(--cyan); }
  .surge { color:var(--acc-hi); }
</style>
 </head>
 <body>
 <div id="app">
  <h1>CLASHBOUND <span class="hero">— arena TCG prototype (v0.1, human vs AI)</span></h1>
  <div class="bar" id="oppbar"></div>
  <div class="board" id="oppboard"></div>
  <div class="bar" id="midbar">
    <div class="contest">
      <span class="cp-label">Contest · first to 8</span>
      <span class="cp" id="cp"></span>
    </div>
    <span class="phase" id="turn"></span>
    <button id="endturn">End turn</button>
    <button id="power">Hero power (2)</button>
    <button id="newgame">New game</button>
  </div>
  <div class="legend" aria-label="Keyword legend">
    <strong>Keyword legend</strong>
    <span><b>Guard</b> draws attacks</span>
    <span><b>Blitz</b> attacks this turn</span>
    <span><b>Pierce</b> carries excess damage</span>
    <span><b>Deathcry</b> triggers on defeat</span>
    <span><b>Warcry</b> triggers on summon</span>
    <span><b>Ward</b> ignores first damage each turn</span>
    <span><b>Surge</b> <em>system: temporary mana</em></span>
  </div>
  <div class="board" id="myboard"></div>
  <div class="bar" id="mybar"></div>
  <div class="hand" id="hand"></div>
  <div id="clashprompt"><span id="clashinfo"></span><span id="clashcards"></span><button id="decline">Decline</button></div>
  <div id="log"></div>
</div>
<script src="engine.js"></script>
<script src="cards.js"></script>
<script src="ai.js"></script>
<script src="ui.js"></script>
</body>
</html>
